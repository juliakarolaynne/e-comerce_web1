<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="assets/icons/cart.svg">
    <title>Produtos - Comércio Eletrônico</title>

    <style>
        .titulo-pagina-destaque {
            text-transform: uppercase;
            font-size: 1.8rem;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg py-3 bg-rosa">
            <div class="container-fluid px-4">

                <a class="navbar-brand" href="index.html">
                    <img src="assets/logo/logo preta-01.png" alt="Logo IFG / E-commerce" class="logo-nav">
                </a>

                <button class="navbar-toggler border-dark" type="button" data-bs-toggle="collapse"
                    data-bs-target="#meuMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="meuMenu">

                    <form class="d-flex flex-column flex-sm-row gap-2 mx-auto my-3 my-lg-0 form-pesquisa" style="max-width: 620px;" role="search" onsubmit="event.preventDefault(); aplicarFiltrosProdutos();">
                        <select class="form-select border-dark shadow-none bg-white rounded-pill px-3" id="filtroCategoria" style="min-width: 170px;" onchange="aplicarFiltrosProdutos()">
                            <option value="">Todas as Categorias</option>
                            <option value="Vestuário">Vestuário</option>
                            <option value="Eletrônicos">Eletrônicos</option>
                            <option value="Calçados">Calçados</option>
                            <option value="Eletrodomésticos">Eletrodomésticos</option>
                            <option value="Acessórios">Acessórios</option>
                            <option value="Móveis">Móveis</option>
                        </select>
                        <div class="input-group">
                            <input class="form-control border-dark border-end-0 shadow-none bg-white" type="search"
                                id="campoBusca" placeholder="O que você procura?" oninput="buscarComDebounce()">
                            <button class="btn border border-dark border-start-0 bg-white" type="submit" title="Pesquisar">
                                <img src="assets/icons/lupa.svg" alt="Pesquisar" class="icon-sm">
                            </button>
                        </div>
                    </form>

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-3">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active fw-bold text-dark" aria-current="page"
                                href="produtos.html">Produtos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="contato.html">Contato</a>
                        </li>
                        <li class="nav-item me-2">
                            <a class="nav-link cart-link-wrapper" href="carrinho.html" title="Meu Carrinho">
                                <img src="assets/icons/cart.svg" alt="Carrinho" class="icon-md" id="carrinho-icone">
                                <span id="carrinho-badge" class="badge bg-danger rounded-pill cart-badge-pos d-none">0</span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <button type="button" class="btn btn-outline-dark btn-sm rounded-circle p-1 d-flex align-items-center justify-content-center" 
                                id="btnAlternarTema" onclick="alternarTema()" title="Mudar Tema" style="width: 34px; height: 34px;">
                                🌙
                            </button>
                        </li>

                        <li class="nav-item dropdown border-start border-dark ps-3">
                            <a class="nav-link dropdown-toggle text-dark" href="#" role="button"
                                data-bs-toggle="dropdown" id="toggleUsuario">
                                Olá, Visitante
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end border-dark shadow-sm" id="menuUsuario">
                                <li><a class="dropdown-item" href="novo_usuario.html">Cadastrar</a></li>
                                <li><a class="dropdown-item" href="login.html">Entrar</a></li>
                            </ul>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section>
            <h2 class="text-center fw-bold text-dark mb-5 titulo-pagina-destaque" style="letter-spacing: 1px;">
                Catálogo de Produtos
            </h2>

            <div class="row g-4 justify-content-center" id="lista-produtos">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-dark" role="status"></div>
                    <p class="mt-2 text-muted">Carregando produtos...</p>
                </div>
            </div>
        </section>
    </main>

    <footer
        class="d-flex flex-column flex-sm-row justify-content-between align-items-center px-4 py-3 border-top border-dark bg-rosa">
        <p class="mb-0 text-dark fw-medium text-center">© 2024 Comércio Eletrônico. Todos os direitos reservados.</p>
        <div class="d-flex gap-3 mt-3 mt-sm-0">
            <a href="https://www.instagram.com" target="_blank" class="text-decoration-none" title="Instagram">
                <img src="assets/icons/instagram.svg" alt="Instagram" class="icon-md">
            </a>
            <a href="https://www.facebook.com" target="_blank" class="text-decoration-none" title="Facebook">
                <img src="assets/icons/facebook.svg" alt="Facebook" class="icon-md">
            </a>
            <a href="https://wa.me/5511999999999" target="_blank" class="text-decoration-none" title="WhatsApp">
                <img src="assets/icons/whatsapp.svg" alt="WhatsApp" class="icon-md">
            </a>
        </div>
    </footer>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div id="toastAdicionado" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <strong id="toastProdutoNome">Produto</strong> adicionado ao carrinho!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="assets/icons/cart.svg">
    <title>Entrar - Comércio Eletrônico</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg py-3 bg-rosa">
            <div class="container-fluid px-4">

                <a class="navbar-brand" href="index.html">
                    <img src="assets/logo/logo preta-01.png" alt="Logo IFG / E-commerce" class="logo-nav">
                </a>

                <button class="navbar-toggler border-dark" type="button" data-bs-toggle="collapse"
                    data-bs-target="#meuMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="meuMenu">

                    <form class="d-flex mx-auto my-3 my-lg-0 form-pesquisa" role="search" action="produtos.html">
                        <div class="input-group">
                            <input class="form-control border-dark border-end-0 shadow-none bg-white" type="search"
                                placeholder="O que você procura?">
                            <button class="btn border border-dark border-start-0 bg-white" type="submit">
                                <img src="assets/icons/lupa.svg" alt="Pesquisar" class="icon-sm">
                            </button>
                        </div>
                    </form>

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-3">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="produtos.html">Produtos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="contato.html">Contato</a>
                        </li>
                        <li class="nav-item me-2">
                            <a class="nav-link cart-link-wrapper" href="carrinho.html" title="Meu Carrinho">
                                <img src="assets/icons/cart.svg" alt="Carrinho" class="icon-md" id="carrinho-icone">
                                <span id="carrinho-badge" class="badge bg-danger rounded-pill cart-badge-pos d-none">0</span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <button type="button" class="btn btn-outline-dark btn-sm rounded-circle p-1 d-flex align-items-center justify-content-center" 
                                id="btnAlternarTema" onclick="alternarTema()" title="Mudar Tema" style="width: 34px; height: 34px;">
                                🌙
                            </button>
                        </li>

                        <li class="nav-item dropdown border-start border-dark ps-3">
                            <a class="nav-link dropdown-toggle text-dark fw-bold active" href="#" role="button"
                                data-bs-toggle="dropdown" id="toggleUsuario">
                                Olá, Visitante
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end border-dark shadow-sm" id="menuUsuario">
                                <li><a class="dropdown-item" href="novo_usuario.html">Cadastrar</a></li>
                                <li><a class="dropdown-item fw-bold" href="login.html">Entrar</a></li>
                            </ul>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 d-flex justify-content-center align-items-center flex-grow-1">
        
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 w-100 bg-white" style="max-width: 500px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark">Bem-vindo(a)!</h2>
                <p class="text-muted">Faça login para acessar a sua conta.</p>
            </div>
            
            <form onsubmit="return realizarLogin(event);">
                
                <div class="mb-3">
                    <label for="email" class="form-label fw-medium">E-mail</label>
                    <input type="email" class="form-control bg-light border-0 shadow-none p-3 rounded-3"
                        id="email" placeholder="seu-email@email.com" required>
                </div>
                
                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label for="senha" class="form-label fw-medium">Senha</label>
                        <a href="#" class="text-dark text-decoration-none small">Esqueceu a senha?</a>
                    </div>
                    <input type="password" class="form-control bg-light border-0 shadow-none p-3 rounded-3"
                        id="senha" placeholder="Sua senha cadastrada" required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input shadow-none border-dark" type="checkbox" value="" id="lembrarMe">
                    <label class="form-check-label" for="lembrarMe">
                        Manter-me conectado
                    </label>
                </div>
                
                <button type="submit" class="btn btn-dark w-100 fw-bold py-3 rounded-3 mb-3">Entrar</button>
                
                <p class="text-center mb-0">Não tem uma conta? <a href="novo_usuario.html" class="text-dark fw-bold text-decoration-none">Cadastre-se aqui</a></p>
                
            </form>
        </div>

    </main>

    <footer class="d-flex flex-column flex-sm-row justify-content-between align-items-center px-4 py-3 border-top border-dark bg-rosa mt-auto">
        <p class="mb-0 text-dark fw-medium text-center">© 2024 Comércio Eletrônico. Todos os direitos reservados.</p>
        <div class="d-flex gap-3 mt-3 mt-sm-0">
            <a href="https://www.instagram.com" target="_blank" class="text-decoration-none" title="Instagram">
                <img src="assets/icons/instagram.svg" alt="Instagram" class="icon-md">
            </a>
            <a href="https://www.facebook.com" target="_blank" class="text-decoration-none" title="Facebook">
                <img src="assets/icons/facebook.svg" alt="Facebook" class="icon-md">
            </a>
            <a href="https://wa.me/5511999999999" target="_blank" class="text-decoration-none" title="WhatsApp">
                <img src="assets/icons/whatsapp.svg" alt="WhatsApp" class="icon-md">
            </a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
